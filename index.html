<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>#Film猫</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Noto+Sans+JP:wght@300;400&family=IM+Fell+English:ital@1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}

:root{
  --ink:#1a1814;
  --paper:#f7f4ef;
  --paper2:#f0ece4;
  --rule:#d4cfc6;
  --muted:#9a9088;
  --accent:#2a2420;
}

body{background:var(--paper);color:var(--ink);font-family:'Noto Sans JP',sans-serif;min-height:100vh;}

/* NAV */
nav{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:18px 40px 14px;
  border-bottom:1px solid var(--ink);
}
.nav-logo{
  font-family:'Noto Serif JP',serif;
  font-size:13px;letter-spacing:4px;font-weight:300;
}
.nav-logo strong{font-weight:600;font-size:17px;letter-spacing:2px;}
.nav-issue{font-size:10px;color:var(--muted);letter-spacing:3px;}
.nav-right{display:flex;gap:28px;align-items:baseline;}
.nav-tag{font-size:10px;letter-spacing:2px;color:var(--muted);}

/* MASTHEAD */
.masthead{
  display:grid;grid-template-columns:1fr 2px 1fr;
  gap:0;padding:40px 40px 32px;
  border-bottom:1px solid var(--rule);
}
.masthead-left{padding-right:32px;}
.masthead-rule{background:var(--rule);}
.masthead-right{padding-left:32px;display:flex;flex-direction:column;justify-content:flex-end;}

.mag-title{
  font-family:'IM Fell English',serif;
  font-style:italic;font-size:64px;line-height:1;
  letter-spacing:-1px;color:var(--ink);
  margin-bottom:4px;
}
.mag-hash{font-size:28px;margin-right:2px;font-style:normal;}
.mag-tagline{font-size:10px;letter-spacing:4px;color:var(--muted);margin-top:10px;text-transform:uppercase;}
.masthead-meta{font-size:10px;color:var(--muted);letter-spacing:2px;line-height:2.2;}
.masthead-meta span{display:block;}
.masthead-count{
  font-family:'Noto Serif JP',serif;
  font-size:32px;font-weight:300;color:var(--ink);margin-top:8px;
}
.masthead-count small{font-size:11px;letter-spacing:2px;color:var(--muted);display:block;margin-top:2px;}

/* UPLOAD STRIP */
.upload-strip{
  padding:20px 40px;
  border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:20px;
}
.upload-btn{
  display:flex;align-items:center;gap:10px;
  background:var(--ink);color:var(--paper);
  padding:10px 24px;border:none;cursor:pointer;
  font-family:'Noto Sans JP',sans-serif;
  font-size:11px;letter-spacing:3px;
  transition:opacity 0.2s;
  flex-shrink:0;
}
.upload-btn:hover{opacity:0.8;}
.upload-hint{font-size:10px;color:var(--muted);letter-spacing:2px;}
.upload-drop-zone{
  flex:1;border:1px dashed var(--rule);
  padding:10px 16px;font-size:10px;
  color:var(--muted);letter-spacing:2px;
  cursor:pointer;text-align:center;
  transition:border-color 0.2s;
}
.upload-drop-zone:hover,.upload-drop-zone.dragover{border-color:var(--ink);}
#fileInput{display:none;}

/* GALLERY */
.gallery{padding:0 40px 60px;}

/* Issue header */
.issue-head{
  display:flex;align-items:baseline;gap:16px;
  padding:24px 0 16px;
  border-bottom:1px solid var(--rule);
  margin-bottom:28px;
}
.issue-label{font-family:'Noto Serif JP',serif;font-size:11px;letter-spacing:4px;color:var(--muted);}
.issue-line{flex:1;height:1px;background:var(--rule);}

/* ZINE GRID — alternating layouts */
.zine-grid{display:flex;flex-direction:column;gap:0;}

.zine-entry{border-bottom:1px solid var(--rule);padding:32px 0;}
.zine-entry:last-child{border-bottom:none;}

/* Layout A: big img left, text right */
.layout-a{display:grid;grid-template-columns:3fr 2fr;gap:0;}
/* Layout B: full-width img top, text below in columns */
.layout-b{}
/* Layout C: small img right, text left */
.layout-c{display:grid;grid-template-columns:2fr 3fr;gap:0;}
/* Layout D: two imgs */
.layout-d{display:grid;grid-template-columns:1fr 1fr;gap:0;}

.entry-img-wrap{overflow:hidden;cursor:pointer;position:relative;}
.entry-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;filter:contrast(1.04) brightness(0.98);transition:filter 0.3s;}
.entry-img-wrap:hover img{filter:contrast(1.08) brightness(0.95);}

.layout-a .entry-img-wrap{height:380px;}
.layout-b .entry-img-wrap{height:460px;}
.layout-c .entry-img-wrap{height:320px;}

.entry-body{padding:0 32px;display:flex;flex-direction:column;justify-content:space-between;}
.layout-b .entry-body{display:grid;grid-template-columns:1fr 1px 1fr;gap:0;padding:24px 0 0;}
.layout-b .entry-col1{padding-right:28px;}
.layout-b .entry-col-rule{background:var(--rule);}
.layout-b .entry-col2{padding-left:28px;display:flex;flex-direction:column;justify-content:flex-end;}

.entry-no{
  font-family:'IM Fell English',serif;font-style:italic;
  font-size:11px;color:var(--muted);letter-spacing:2px;margin-bottom:16px;display:block;
}
.entry-title{
  font-family:'Noto Serif JP',serif;
  font-size:22px;font-weight:300;line-height:1.4;
  color:var(--ink);margin-bottom:12px;
}
.entry-title-big{font-size:30px;}
.entry-location{
  font-size:10px;letter-spacing:3px;color:var(--muted);
  margin-bottom:20px;display:flex;align-items:center;gap:6px;
}
.entry-location::before{content:'';display:inline-block;width:16px;height:1px;background:var(--muted);}
.entry-note{
  font-family:'Noto Serif JP',serif;
  font-size:13px;line-height:2.1;color:#3a3630;
  flex:1;
}
.entry-foot{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-top:20px;padding-top:14px;border-top:1px solid var(--rule);
}
.entry-date{font-size:10px;letter-spacing:2px;color:var(--muted);}
.entry-mood-label{
  font-size:10px;letter-spacing:2px;color:var(--muted);
  display:flex;align-items:center;gap:6px;
}
.mood-dot{
  width:8px;height:8px;border-radius:50%;
  display:inline-block;flex-shrink:0;
}
.entry-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.entry-tag{
  font-size:9px;letter-spacing:2px;color:var(--muted);
  border:1px solid var(--rule);padding:3px 9px;
}

/* MOOD COLORS */
.mood-0{background:#2a2420;} /* 平静 */
.mood-1{background:#6a4a3a;} /* 温柔 */
.mood-2{background:#4a5a6a;} /* 忧郁 */
.mood-3{background:#7a6a3a;} /* 兴奋 */
.mood-4{background:#5a6a4a;} /* 治愈 */
.mood-5{background:#6a3a4a;} /* 孤独 */
.mood-6{background:#3a4a6a;} /* 沉思 */
.mood-7{background:#8a7a5a;} /* 怀念 */

/* EMPTY */
.empty{
  padding:80px 0;text-align:center;
}
.empty-title{font-family:'IM Fell English',serif;font-style:italic;font-size:28px;color:var(--muted);margin-bottom:8px;}
.empty-sub{font-size:10px;letter-spacing:3px;color:var(--rule);}

/* MODAL BASE */
.overlay{
  display:none;position:fixed;inset:0;
  background:rgba(15,12,10,0.8);
  z-index:200;align-items:center;justify-content:center;
  padding:24px;
}
.overlay.open{display:flex;}

/* UPLOAD MODAL */
.umodal{
  background:var(--paper);
  width:100%;max-width:640px;max-height:92vh;overflow-y:auto;
  border:1px solid var(--ink);
  padding:36px;position:relative;
}
.umodal-close{
  position:absolute;top:16px;right:20px;
  background:none;border:none;font-size:11px;
  letter-spacing:2px;color:var(--muted);cursor:pointer;
}
.umodal-close:hover{color:var(--ink);}
.umodal-prev{width:100%;max-height:280px;object-fit:cover;display:block;margin-bottom:28px;filter:contrast(1.04);}
.umodal-title{font-family:'Noto Serif JP',serif;font-size:13px;font-weight:300;letter-spacing:4px;color:var(--muted);margin-bottom:24px;}

.field{margin-bottom:18px;}
.field label{display:block;font-size:9px;letter-spacing:3px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;}
.field input,.field textarea{
  width:100%;background:transparent;
  border:none;border-bottom:1px solid var(--rule);
  padding:6px 0;font-family:'Noto Sans JP',sans-serif;
  font-size:13px;color:var(--ink);outline:none;
  transition:border-color 0.2s;
}
.field input:focus,.field textarea:focus{border-color:var(--ink);}
.field textarea{resize:none;min-height:72px;line-height:1.9;margin-top:4px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:24px;}

/* MOOD PICKER */
.mood-picker{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.mpick{
  padding:10px 8px;border:1px solid var(--rule);
  background:transparent;cursor:pointer;
  font-family:'Noto Sans JP',sans-serif;font-size:10px;
  letter-spacing:1px;color:var(--muted);
  display:flex;align-items:center;gap:7px;
  transition:all 0.15s;text-align:left;
}
.mpick:hover{border-color:var(--ink);color:var(--ink);}
.mpick.sel{border-color:var(--ink);background:var(--ink);color:var(--paper);}
.mpick.sel .mood-dot{background:var(--paper) !important;}

.submit-btn{
  width:100%;margin-top:24px;
  background:var(--ink);color:var(--paper);
  border:none;padding:14px;
  font-family:'Noto Sans JP',sans-serif;
  font-size:10px;letter-spacing:5px;cursor:pointer;
  transition:opacity 0.2s;
}
.submit-btn:hover{opacity:0.8;}

/* DETAIL MODAL */
.dmodal{
  background:var(--paper);
  width:100%;max-width:820px;max-height:94vh;overflow-y:auto;
  border:1px solid var(--ink);
  position:relative;
}
.dmodal-img{width:100%;max-height:520px;object-fit:cover;display:block;filter:contrast(1.04);}
.dmodal-body{padding:32px 40px;}
.dmodal-no{font-family:'IM Fell English',serif;font-style:italic;font-size:11px;color:var(--muted);letter-spacing:2px;margin-bottom:12px;}
.dmodal-title{font-family:'Noto Serif JP',serif;font-size:28px;font-weight:300;margin-bottom:16px;line-height:1.3;}
.dmodal-meta{display:flex;align-items:center;gap:20px;padding:14px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-bottom:24px;}
.dmodal-loc,.dmodal-date{font-size:10px;letter-spacing:2px;color:var(--muted);}
.dmodal-moodrow{display:flex;align-items:center;gap:7px;margin-left:auto;}
.dmodal-note{font-family:'Noto Serif JP',serif;font-size:14px;line-height:2.3;color:#3a3630;}
.dmodal-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;}
.dmodal-tag{font-size:9px;letter-spacing:2px;color:var(--muted);border:1px solid var(--rule);padding:3px 9px;}
.dmodal-del{
  display:block;margin-top:28px;font-size:9px;letter-spacing:2px;
  color:var(--rule);background:none;border:none;cursor:pointer;
  padding:0;transition:color 0.2s;
}
.dmodal-del:hover{color:#8a3020;}
</style>
</head>
<body>

<nav>
  <div class="nav-logo"><strong>#Film猫</strong> &nbsp;·&nbsp; zine journal</div>
  <div class="nav-right">
    <div class="nav-tag" id="navDate"></div>
    <div class="nav-tag" id="navCount">NO.000</div>
  </div>
</nav>

<div class="masthead">
  <div class="masthead-left">
    <div class="mag-title"><span class="mag-hash">#</span>Film猫</div>
    <div class="mag-tagline">A personal film photography journal</div>
  </div>
  <div class="masthead-rule"></div>
  <div class="masthead-right">
    <div class="masthead-meta">
      <span id="mhDate"></span>
      <span>INDEPENDENT ZINE</span>
      <span>PHOTOGRAPHY · MEMORY · FEELING</span>
    </div>
    <div class="masthead-count" id="mhCount">000<small>FRAMES COLLECTED</small></div>
  </div>
</div>

<div class="upload-strip">
  <button class="upload-btn" onclick="document.getElementById('fileInput').click()">+ 上传胶片</button>
  <div class="upload-drop-zone" id="dropZone">拖拽照片到此处</div>
  <input type="file" id="fileInput" accept="image/*">
</div>

<div class="gallery">
  <div class="issue-head">
    <span class="issue-label">CONTENTS</span>
    <div class="issue-line"></div>
    <span class="issue-label" id="issueCount"></span>
  </div>
  <div class="zine-grid" id="zineGrid">
    <div class="empty">
      <div class="empty-title">no frames yet.</div>
      <div class="empty-sub">上传你的第一张胶片</div>
    </div>
  </div>
</div>

<!-- Upload Modal -->
<div class="overlay" id="uOverlay">
  <div class="umodal">
    <button class="umodal-close" onclick="closeU()">CLOSE ×</button>
    <img id="uPrev" class="umodal-prev" src="" alt="">
    <div class="umodal-title">RECORD THIS FRAME</div>
    <div class="field-row">
      <div class="field"><label>Title</label><input id="fTitle" type="text" placeholder="这一刻的名字"></div>
      <div class="field"><label>Location</label><input id="fLoc" type="text" placeholder="地点"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Date</label><input id="fDate" type="date"></div>
      <div class="field"><label>Tags（逗号分隔）</label><input id="fTags" type="text" placeholder="人文, 黄昏, 街拍"></div>
    </div>
    <div class="field">
      <label>Mood</label>
      <div class="mood-picker" id="moodPicker">
        <button class="mpick" data-i="0" onclick="pickMood(this)"><span class="mood-dot mood-0"></span>平静</button>
        <button class="mpick" data-i="1" onclick="pickMood(this)"><span class="mood-dot mood-1"></span>温柔</button>
        <button class="mpick" data-i="2" onclick="pickMood(this)"><span class="mood-dot mood-2"></span>忧郁</button>
        <button class="mpick" data-i="3" onclick="pickMood(this)"><span class="mood-dot mood-3"></span>兴奋</button>
        <button class="mpick" data-i="4" onclick="pickMood(this)"><span class="mood-dot mood-4"></span>治愈</button>
        <button class="mpick" data-i="5" onclick="pickMood(this)"><span class="mood-dot mood-5"></span>孤独</button>
        <button class="mpick" data-i="6" onclick="pickMood(this)"><span class="mood-dot mood-6"></span>沉思</button>
        <button class="mpick" data-i="7" onclick="pickMood(this)"><span class="mood-dot mood-7"></span>怀念</button>
      </div>
    </div>
    <div class="field"><label>Note</label><textarea id="fNote" placeholder="写下当时的心情或故事……"></textarea></div>
    <button class="submit-btn" onclick="save()">— 记 录 —</button>
  </div>
</div>

<!-- Detail Modal -->
<div class="overlay" id="dOverlay">
  <div class="dmodal">
    <button class="umodal-close" onclick="closeD()" style="top:12px;right:16px;">CLOSE ×</button>
    <img id="dImg" class="dmodal-img" src="" alt="">
    <div class="dmodal-body">
      <div class="dmodal-no" id="dNo"></div>
      <div class="dmodal-title" id="dTitle"></div>
      <div class="dmodal-meta">
        <span class="dmodal-date" id="dDate"></span>
        <span class="dmodal-loc" id="dLoc"></span>
        <div class="dmodal-moodrow">
          <span class="mood-dot" id="dMoodDot"></span>
          <span class="dmodal-loc" id="dMoodLbl"></span>
        </div>
      </div>
      <div class="dmodal-note" id="dNote"></div>
      <div class="dmodal-tags" id="dTags"></div>
      <button class="dmodal-del" id="dDel">DELETE THIS FRAME</button>
    </div>
  </div>
</div>

<script>
const MOODS = ['平静','温柔','忧郁','兴奋','治愈','孤独','沉思','怀念'];
let photos = JSON.parse(localStorage.getItem('filmcat_v2')||'[]');
let pending = null, selMood = -1, currentId = null;

function init(){
  const now = new Date();
  const ds = now.toLocaleDateString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\//g,'.');
  document.getElementById('navDate').textContent = ds;
  document.getElementById('mhDate').textContent = ds;
  document.getElementById('fDate').value = now.toISOString().split('T')[0];
  render(); updateCount();
}

/* DRAG DROP */
const dz = document.getElementById('dropZone');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('dragover');});
dz.addEventListener('dragleave',()=>dz.classList.remove('dragover'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('dragover');const f=e.dataTransfer.files[0];if(f&&f.type.startsWith('image/'))openU(f);});
dz.addEventListener('click',()=>document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change',e=>{if(e.target.files[0])openU(e.target.files[0]);e.target.value='';});

function openU(f){
  pending=f;
  const r=new FileReader();
  r.onload=ev=>{document.getElementById('uPrev').src=ev.target.result;document.getElementById('uOverlay').classList.add('open');};
  r.readAsDataURL(f);
}
function closeU(){
  document.getElementById('uOverlay').classList.remove('open');
  pending=null;selMood=-1;
  document.querySelectorAll('.mpick').forEach(b=>b.classList.remove('sel'));
  ['fTitle','fLoc','fNote','fTags'].forEach(id=>document.getElementById(id).value='');
}
function pickMood(btn){
  document.querySelectorAll('.mpick').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');selMood=+btn.dataset.i;
}
function save(){
  if(!pending)return;
  const r=new FileReader();
  r.onload=ev=>{
    photos.unshift({id:Date.now(),src:ev.target.result,
      title:document.getElementById('fTitle').value||'無題',
      loc:document.getElementById('fLoc').value,
      date:document.getElementById('fDate').value,
      mood:selMood,
      note:document.getElementById('fNote').value,
      tags:document.getElementById('fTags').value.split(',').map(t=>t.trim()).filter(Boolean)
    });
    localStorage.setItem('filmcat_v2',JSON.stringify(photos));
    closeU();render();updateCount();
  };
  r.readAsDataURL(pending);
}

/* RENDER */
const LAYOUTS=['layout-a','layout-b','layout-c','layout-a','layout-c','layout-b'];
function render(){
  const g=document.getElementById('zineGrid');
  if(!photos.length){g.innerHTML='<div class="empty"><div class="empty-title">no frames yet.</div><div class="empty-sub">上传你的第一张胶片</div></div>';return;}
  g.innerHTML=photos.map((p,i)=>{
    const lay=LAYOUTS[i%LAYOUTS.length];
    const no='No.'+(String(photos.length-i).padStart(3,'0'));
    const moodDot=p.mood>=0?`<span class="mood-dot mood-${p.mood}"></span>`:'';
    const moodLbl=p.mood>=0?`<span class="entry-mood-label">${moodDot}${MOODS[p.mood]}</span>`:'';
    const tags=p.tags.length?`<div class="entry-tags">${p.tags.map(t=>`<span class="entry-tag">${t}</span>`).join('')}</div>`:'';
    const foot=`<div class="entry-foot"><span class="entry-date">${fmtDate(p.date)}</span>${moodLbl}</div>${tags}`;

    if(lay==='layout-a') return `
    <div class="zine-entry layout-a">
      <div class="entry-img-wrap" onclick="openD(${p.id})"><img src="${p.src}" alt="${p.title}"></div>
      <div class="entry-body">
        <div>
          <span class="entry-no">${no}</span>
          <div class="entry-title entry-title-big">${p.title}</div>
          ${p.loc?`<div class="entry-location">${p.loc}</div>`:''}
          <div class="entry-note">${p.note||''}</div>
        </div>
        ${foot}
      </div>
    </div>`;

    if(lay==='layout-b') return `
    <div class="zine-entry layout-b">
      <div class="entry-img-wrap" onclick="openD(${p.id})"><img src="${p.src}" alt="${p.title}"></div>
      <div class="entry-body">
        <div class="entry-col1">
          <span class="entry-no">${no}</span>
          <div class="entry-title entry-title-big">${p.title}</div>
          ${p.loc?`<div class="entry-location">${p.loc}</div>`:''}
        </div>
        <div class="entry-col-rule"></div>
        <div class="entry-col2">
          <div class="entry-note">${p.note||''}</div>
          ${foot}
        </div>
      </div>
    </div>`;

    return `
    <div class="zine-entry layout-c">
      <div class="entry-body">
        <div>
          <span class="entry-no">${no}</span>
          <div class="entry-title">${p.title}</div>
          ${p.loc?`<div class="entry-location">${p.loc}</div>`:''}
          <div class="entry-note">${p.note||''}</div>
        </div>
        ${foot}
      </div>
      <div class="entry-img-wrap" onclick="openD(${p.id})"><img src="${p.src}" alt="${p.title}"></div>
    </div>`;
  }).join('');
}

function openD(id){
  currentId=id;
  const p=photos.find(x=>x.id===id);if(!p)return;
  const idx=photos.findIndex(x=>x.id===id);
  document.getElementById('dImg').src=p.src;
  document.getElementById('dNo').textContent='No.'+(String(photos.length-idx).padStart(3,'0'));
  document.getElementById('dTitle').textContent=p.title;
  document.getElementById('dDate').textContent=fmtDate(p.date);
  document.getElementById('dLoc').textContent=p.loc||'';
  const dot=document.getElementById('dMoodDot');
  const lbl=document.getElementById('dMoodLbl');
  if(p.mood>=0){dot.className='mood-dot mood-'+p.mood;lbl.textContent=MOODS[p.mood];}
  else{dot.className='mood-dot';lbl.textContent='';}
  document.getElementById('dNote').textContent=p.note||'';
  document.getElementById('dTags').innerHTML=p.tags.map(t=>`<span class="dmodal-tag">${t}</span>`).join('');
  document.getElementById('dDel').onclick=()=>{if(confirm('删除这帧记录？')){photos=photos.filter(x=>x.id!==id);localStorage.setItem('filmcat_v2',JSON.stringify(photos));closeD();render();updateCount();}};
  document.getElementById('dOverlay').classList.add('open');
}
function closeD(){document.getElementById('dOverlay').classList.remove('open');}

function updateCount(){
  const n=photos.length;
  const s=String(n).padStart(3,'0');
  document.getElementById('navCount').textContent='NO.'+s;
  document.getElementById('mhCount').innerHTML=s+'<small>FRAMES COLLECTED</small>';
  document.getElementById('issueCount').textContent=n?n+' FRAMES':'';
}
function fmtDate(d){if(!d)return'';const dt=new Date(d+'T00:00:00');return dt.toLocaleDateString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\//g,'.');}

document.getElementById('uOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeU();});
document.getElementById('dOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeD();});

init();
</script>
</body>
</html>
